defaults:
  - /callbacks/rollout/tasks@tasks: calvin_D_3T_tasks
  - /annotations@val_annotations: calvin_D_3T_validation
_target_: itpg.rollout.rollout_itpg.Rollout
_recursive_: false
env_cfg:
  _target_: itpg.evaluation.wrappers.calvin_env_wrapper.CalvinEnvWrapper
skip_epochs: 1
rollout_freq: 100
video: true
num_rollouts_per_task: 10
check_percentage_of_batch: 1  # which percentage of sequences do we want to check for possible tasks
ep_len: 15
empty_cache: true
log_video_to_file: false
save_dir: ./videos
add_goal_thumbnail: true
min_window_size: 16 #${datamodule.datasets.vision_dataset.min_window_size}
max_window_size: 32 #${datamodule.datasets.vision_dataset.max_window_size}
id_selection_strategy: "select_longest"
lang_folder: "lang_annotations" #${datamodule.datasets.lang_dataset.lang_folder}
